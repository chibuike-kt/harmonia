services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harmonia
      POSTGRES_PASSWORD: harmonia
      POSTGRES_DB: harmonia
    ports:
      - "5432:5432"
    volumes:
      - harmonia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmonia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration runner — not part of the default `up`. Invoke with:
  #   docker compose run --rm migrate up
  #   docker compose run --rm migrate down 1
  migrate:
    image: migrate/migrate:4
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://harmonia:harmonia@postgres:5432/harmonia?sslmode=disable

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Overrides .env's localhost values with in-network service names —
      # the api container talks to "postgres"/"redis", not "localhost".
      HARMONIA_DATABASE_URL: postgres://harmonia:harmonia@postgres:5432/harmonia?sslmode=disable
      HARMONIA_REDIS_ADDR: "redis:6379"
      HARMONIA_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  harmonia_pgdata:
